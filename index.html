<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="tabName">MyQR - QR-code generator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <table class="header-table">
        <tr>
          <td>
            <h1 class="logo" data-i18n="appHeader_name">MyQR</h1>
            <p class="tagline" data-i18n="appHeader_description">Локальная генерация QR-кодов</p>
          </td>
          <td id="lang-list">
            <select id="lang_select" class="input select" style="width: auto;">
              <option value="en">English</option>
              <option value="ru">Russian</option>
            </select>
          </td>
        </tr>
      </table>
    </div>
  </header>

  <main class="container layout">
    
    <!-- Result -->
    <section class="card preview" aria-labelledby="preview-title">
      <h2 id="preview-title" class="card-title" data-i18n="result_header">Результат</h2>
      <!-- !!! -->
      <!-- 
      
      ДОБАВИТЬ АВТОМАТИЧЕСКУЮ СМЕНУ ЦВЕТА ЗАДНЕГО ФОНА 
      Добавить ограничение ширины по квадрату
      Добавить тонкую рамку
      
      --> 
      <!-- !!! -->
      <div class="preview-stage checkerboard" id="preview-stage" style="background-color: brown;">
      <!-- !!! -->
      <!-- !!! -->
        <img id="preview-img" alt="Сгенерированный QR-код" draggable="false" hidden />
      </div>
      <span class="label" data-i18n="result_saveHead">Сохранить изображение</span>
      <div class="downloads">
        <button type="button" id="download-jpg" class="btn btn-outline" data-i18n="result_copyJPG">JPG</button>
        <button type="button" id="download-png" class="btn btn-outline" data-i18n="result_copyPNG">PNG</button>
        <button type="button" id="download-svg" class="btn btn-outline" data-i18n="result_copySVG">SVG</button>
      </div>
      <span class="label" data-i18n="result_copyHead">Копировать изображение</span>
      <div class="downloads">
        <button type="button" id="copy-jpg" class="btn btn-outline" data-i18n="result_copyJPG">С фоном</button>
        <button type="button" id="copy-png" class="btn btn-outline" data-i18n="result_copyPNG">Без фона</button>
        <button type="button" id="copy-svg" class="btn btn-outline" data-i18n="result_copySVG">Вектор</button>
      </div>
    </section>
    
    <!-- Settings -->
    <section class="card controls" aria-labelledby="controls-title">
      <h2 id="controls-title" class="card-title" data-i18n="settings_header">Настройки</h2>

      <div class="field">
        <label class="label" for="text-input" data-i18n="settings_inputHead">Текст или ссылка</label>
        <textarea id="text-input" class="input textarea" rows="5" autofocus>https://example.com</textarea>
      </div>

      <div class="field">
        <label class="label" for="ec-level" data-i18n="settings_correctingHead">Коррекция ошибок</label>
        <div class="select-wrap">
          <select id="ec-level" class="input select">
            <option value="L" data-i18n="settings_correctingL">L – низкая (до 7%)</option>
            <option value="M" data-i18n="settings_correctingM" selected>M – средняя (до 15%)</option>
            <option value="Q" data-i18n="settings_correctingQ">Q – высокая (до 25%)</option>
            <option value="H" data-i18n="settings_correctingH">H – максимальная (до 30%)</option>
          </select>
        </div>
        <p class="hint" id="ec-hint" data-i18n="settings_correctingTip">Процент максимально допустимого дефекта изображения (чем больше, тем надёжнее).</p>
      </div>

      <div class="field">
        <legend class="label" data-i18n="settings_codeColorHead">Цвет QR-кода</legend>
        <div class="color-row">
          <div class="swatches" id="fg-swatches"></div>
          <label class="color-pick" title="Свой цвет – вся палитра">
            <input type="color" id="fg-color" value="#0f172a" />
          </label>
        </div>
      </div>

      <div class="field">
        <legend class="label" data-i18n="settings_backgroundColorHead">Цвет фона</legend>
        <div class="color-row">
          <div class="swatches" id="bg-swatches"></div>
          <label class="color-pick" title="Свой цвет – вся палитра">
            <input type="color" id="bg-color" value="#ffffff" />
          </label>
        </div>
        <p class="hint" id="ec-hint" data-i18n="settings_backgroundColorTip">Фон используется при сохранении и копировании с форном.</p>
      </div>

    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/qrcode.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
